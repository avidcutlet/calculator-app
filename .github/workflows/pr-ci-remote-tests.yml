name: Pull Request CI - Remote UI Tests

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  actions: write
  pull-requests: write
  statuses: write

concurrency:
  group: pr-ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  remote-ui-tests:
    name: Execute Remote UI Tests
    runs-on: ubuntu-latest

    steps:
      - name: Dispatch Remote Test Workflow
        id: dispatch-remote
        uses: actions/github-script@v7
        env:
          TARGET_OWNER: "avidcutlet"                     # 🧩 Update this to your GitHub username
          TARGET_REPO: "calculator-app-test"                  # 🧩 Update to your test automation repo name
          APP_UNDER_TEST_URL: "https://avidcutlet.github.io/calculator-app/" # 🧩 Update this
        with:
          github-token: ${{ secrets.CI_PAT }}         # PAT with repo + workflow access
          script: |
            const { TARGET_OWNER, TARGET_REPO, APP_UNDER_TEST_URL } = process.env;
            const dispatchedAt = new Date().toISOString();

            const payload = {
              app_url: APP_UNDER_TEST_URL,
              source_repo: `${context.repo.owner}/${context.repo.repo}`,
              sha: context.sha,
              ref: context.payload.pull_request?.head?.ref || context.ref.replace('refs/heads/', '')
            };

            await github.rest.repos.createDispatchEvent({
              owner: TARGET_OWNER,
              repo: TARGET_REPO,
              event_type: 'run-tests',
              client_payload: payload
            });

            core.info(`Repository dispatch sent: ${JSON.stringify(payload)}`);
            core.setOutput('dispatched_at', dispatchedAt);

      - name: Monitor Remote Test Execution
        id: monitor-remote
        uses: actions/github-script@v7
        env:
          TARGET_OWNER: "avidcutlet"
          TARGET_REPO: "calculator-app-test"
          DISPATCHED_AT: ${{ steps.dispatch-remote.outputs.dispatched_at }}
        with:
          github-token: ${{ secrets.CI_PAT }}
          script: |
            const { TARGET_OWNER, TARGET_REPO, DISPATCHED_AT } = process.env;
            const workflowFile = 'on-dispatch-tests.yml';
            const timeout = 20 * 60 * 1000;
            const startTime = Date.now();
            const dispatchedMs = Date.parse(DISPATCHED_AT);
            let runId = null;

            // Find workflow run
            while (Date.now() - startTime < timeout) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner: TARGET_OWNER, repo: TARGET_REPO,
                workflow_id: workflowFile, event: 'repository_dispatch', per_page: 10
              });
              const match = data.workflow_runs.find(r => Date.parse(r.created_at) >= dispatchedMs);
              if (match) { runId = match.id; break; }
              await new Promise(r => setTimeout(r, 5000));
            }

            if (!runId) core.setFailed('No matching test run found.');

            // Wait until completion
            let run;
            while (Date.now() - startTime < timeout) {
              const { data } = await github.rest.actions.getWorkflowRun({
                owner: TARGET_OWNER, repo: TARGET_REPO, run_id: runId
              });
              run = data;
              if (run.status === 'completed') break;
              await new Promise(r => setTimeout(r, 10000));
            }

            core.setOutput('run_url', run.html_url);
            core.setOutput('conclusion', run.conclusion || 'unknown');

            if (run.conclusion !== 'success') {
              core.setFailed(`Remote UI Tests failed: ${run.conclusion}`);
            }

      - name: Update Commit Status
        if: ${{ always() }}
        uses: actions/github-script@v7
        env:
          RUN_URL: ${{ steps.monitor-remote.outputs.run_url }}
          CONCLUSION: ${{ steps.monitor-remote.outputs.conclusion }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const state = process.env.CONCLUSION === 'success' ? 'success' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: 'Remote UI Tests',
              target_url: process.env.RUN_URL,
              description: state === 'success' ? 'All remote tests passed' : 'Remote tests failed'
            });

      - name: Comment on Pull Request (if failed)
        if: ${{ always() && steps.monitor-remote.outputs.conclusion != 'success' }}
        uses: actions/github-script@v7
        env:
          RUN_URL: ${{ steps.monitor-remote.outputs.run_url }}
          CONCLUSION: ${{ steps.monitor-remote.outputs.conclusion }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = context.payload.pull_request?.number;
            if (!prNumber) return;

            const body = [
              '🚨 **Automated UI Tests Failed**',
              '',
              `🔗 [View Test Report](${process.env.RUN_URL})`,
              '',
              `**Conclusion:** ${process.env.CONCLUSION.toUpperCase()}`
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body
            });